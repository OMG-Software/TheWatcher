# SonarCloud automatic-analysis settings.
#
# Test code is left out of copy/paste (duplication) detection only. BDD
# scenarios repeat their GIVEN/WHEN/THEN setup on purpose so each scenario
# reads on its own, and counting that against the "duplication on new code"
# quality gate fails every pull request that adds or reformats tests. All
# other analysis (bugs, vulnerabilities, code smells) still covers these files.
sonar.cpd.exclusions=agent_tests/**,common_tests/**,server_tests/**,integration_tests/**,test_support/**,dashboard/src/**/*.test.ts,dashboard/src/**/*.test.tsx
